version: '3.8'

services:
  web:
    build: .
    restart: always
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=ishemalink.settings
    volumes:
      - static_volume:/app/staticfiles
    expose:
      - 8000
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=ishemalink_db
      - POSTGRES_USER=ishemalink_user
      - POSTGRES_PASSWORD=ishemalink_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
